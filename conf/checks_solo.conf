# 统一检查项配置文件 - Web Solo 环境
# 格式：检查项名称:类型:执行命令

# ============ 系统基础信息 ============
system:system:cat /etc/os-release | grep PRETTY_NAME | cut -d'=' -f2 | tr -d '"'
kernel:system:uname -r
architecture:system:uname -m
uptime:system:uptime

# ============ CPU 信息 ============
cpu:cpu:top -bn1 | grep 'Cpu(s)'
loadavg:system:uptime

# ============ 内存信息 ============
mem:mem:free -m
swap:swap:free -m

# ============ 磁盘信息 ============
disk_workspace:disk:df -h /workspace

# ============ 进程检查 ============
sshd:vhost:ps aux | grep sshd  | grep -v grep
python3:vhost:ps aux | grep python |grep -v login | grep -v grep
supervisord:vhost:ps aux | grep supervisord | grep -v grep

# ============ 阈值定义 ============
threshold:cpu:70,85
threshold:mem:70,85
threshold:disk_workspace:80,90
